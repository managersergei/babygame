<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>S02 Слово №2 СТОП</title>
<link rel="stylesheet" href="../kit/reel.css"></head><body><div id="stage"></div>
<script src="../kit/engine.js"></script><script src="../kit/world.js"></script>
<script>
dur(10.5);
var w = world();
document.getElementById('stage').insertAdjacentHTML('beforeend', '<div class="light el" id="light" style="left:760px"><i class="r"></i><i class="y"></i><i class="g"></i></div>');
car('fire', 330, 1300, 200);
text('label', 'СЛОВО №2', 'lab'); set('#lab', { o: 0, y: -30 }); tw('#lab', 0.1, 0.4, { o: [0, 1], y: [-30, 0] });
text('hook', 'Скажи СТОП —\nи машинка остановится', 'hook'); set('#hook', { o: 0, y: 30 }); tw('#hook', 0.3, 0.5, { o: [0, 1], y: [30, 0] }, 'back');
set('#car', { x: -750 }); tw('#car', 0, 1.6, { x: [-750, 0] });
set('#light', { x: 600 }); tw('#light', 0.5, 1.4, { x: [600, 0] });
var speed = 900, target = 900;
every(function (t) { speed += (target - speed) * 0.12; w.road(t, speed); });
at(1.9, function () { document.querySelector('#light .r').classList.add('on'); });
say(2.1, 'Красный свет! Скажи слово: стоп!');

tw('#kid', 4.8, 0.35, { o: [0, 1], y: [40, 0] }, 'back');
tw('#word', 4.9, 0.35, { o: [0, 1], scale: [0.4, 1] }, 'back');
at(5.1, function () { target = 0; });
tw('#car', 5.1, 0.3, { rot: [0, -6] }); tw('#car', 5.4, 0.5, { rot: [-6, 0] }, 'back');
say(5.6, 'Стоп! Машинка остановилась. Ждём зелёный!');
at(7.9, function () { document.querySelector('#light .r').classList.remove('on'); document.querySelector('#light .g').classList.add('on'); });
say(8.0, 'Зелёный свет! Поехали!');
at(8.4, function () { target = 900; });
tw('#car', 8.4, 0.25, { rot: [0, 5] }); tw('#car', 8.65, 0.5, { rot: [5, 0] }, 'back');
tw('#word', 8.2, 0.3, { o: [1, 0] }); tw('#kid', 8.2, 0.3, { o: [1, 0] });
endCard(9.3, 'МАШИНКИ', 'игра, где ребёнок говорит', 'Слово №3 — завтра · ссылка в профиле');
</script></body></html>

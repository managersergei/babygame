<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>S06 Три слова ради машинки</title>
<link rel="stylesheet" href="../kit/reel.css"></head><body><div id="stage"></div>
<script src="../../assets/paths.js"></script>
<script src="../kit/engine.js"></script><script src="../kit/world.js"></script>
<script>
dur(13.5);
var w = world();
document.getElementById('stage').insertAdjacentHTML('beforeend', '<div class="pit el" id="pit" style="left:1250px"></div>');
car('fire', 330, 1300, 200); set('#car', { x: -750 }); tw('#car', 0, 1.4, { x: [-750, 0] });
sprite('fuel', 1200, 1300, 150, 'fuel'); sprite('sheep', 1200, 1300, 170, 'sheep');
var speed = 900; every(function (t) { w.road(t, speed); });
text('hook', '3 слова, которые трёхлетка\nскажет ради машинки', 'hook'); document.getElementById('hook').classList.add('small');
set('#hook', { o: 0, y: 30 }); tw('#hook', 0.2, 0.5, { o: [0, 1], y: [30, 0] }, 'back');
text('word sm', '', 'word'); set('#word', { o: 0, scale: 0.4 });
text('kid', '', 'kid'); set('#kid', { o: 0, y: 40 });
function beat(t0, wordTxt, kidTxt) {
  at(t0, function () { document.getElementById('word').textContent = wordTxt; document.getElementById('kid').textContent = '🧒 — ' + kidTxt + '!'; });
  tw('#kid', t0, 0.3, { o: [0, 1], y: [40, 0] }, 'back'); tw('#word', t0 + 0.1, 0.3, { o: [0, 1], scale: [0.4, 1] }, 'back');
  tw('#word', t0 + 1.6, 0.3, { o: [1, 0] }); tw('#kid', t0 + 1.6, 0.3, { o: [1, 0] });
}
// 1 — ПРЫЖОК
tw('#pit', 0.5, 1.4, { x: [0, -560] }); at(1.9, function () { speed = 0; });
say(1.3, 'Ой! Яма! Скажи слово: прыжок!');
beat(3.7, 'ПРЫЖОК', 'ПРЫЖОК'); at(4.3, function () { speed = 900; }); jump('#car', 4.1, 330, 0.85); tw('#pit', 4.3, 0.9, { x: [-560, -1400] }, 'linear');
// 2 — БЕНЗИН
tw('#fuel', 5.2, 1.4, { x: [0, -520] }); at(6.5, function () { speed = 0; });
say(5.4, 'Скажи слово: бензин!');
beat(7.0, 'БЕНЗИН', 'БЕНЗИН'); at(7.5, function () { speed = 900; });
tw('#fuel', 7.5, 0.45, { x: [-520, -820], y: [0, -120], scale: [1, 0.2], o: [1, 0] }, 'in');
// 3 — БИБИ
tw('#sheep', 8.4, 1.4, { x: [0, -560] }); at(9.7, function () { speed = 0; });
say(8.6, 'Смотри, на дороге овечка! Скажи слово: би-би!');
beat(11.0, 'БИБИ', 'БИ-БИ'); at(11.4, function () { speed = 900; });
tw('#sheep', 11.3, 0.9, { x: [-560, -1500] }, 'in'); tw('#sheep', 11.3, 0.9, { y: [0, -20] }, 'bounce');
endCard(12.3, 'МАШИНКИ', 'игра, где ребёнок говорит', 'ссылка в профиле');
</script></body></html>

<script src="../kit/engine.js"></script><script src="../kit/world.js"></script>
<script>
dur(12.5);
var w = world();
document.getElementById('stage').insertAdjacentHTML('beforeend', '<div class="pit el" id="pit" style="left:1250px"></div>');
car('fire', 330, 1300, 200); set('#car', { x: -750 }); tw('#car', 0, 1.6, { x: [-750, 0] });
tw('#pit', 0.6, 1.5, { x: [0, -560] });
var speed = 900; at(2.1, function () { speed = 0; }); every(function (t) { w.road(t, speed); });
text('hook', 'Что делает игра,\nкогда ребёнок молчит?', 'hook'); set('#hook', { o: 0, y: 30 }); tw('#hook', 0.2, 0.5, { o: [0, 1], y: [30, 0] }, 'back');

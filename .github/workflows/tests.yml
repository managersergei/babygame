name: tests
# На пуш — быстрый набор (около 3 минут). Полный, включая четыре теста, которые
# моделируют минуты реальной игры, — ночью и по кнопке Run workflow.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Полный набор (долго, ~25 минут)'
        type: boolean
        default: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Игра раздаётся как собранный index.html. Если он разошёлся с src/ — значит,
      # кто-то правил собранный файл руками, и правка потеряется при следующей сборке.
      - name: Сборка совпадает с index.html
        run: node tools/build.mjs --check
      # Поменяли index.html или vendor/, а VER в sw.js — нет: телефоны останутся на старой игре из кеша.
      # База — коммит до пуша или база PR; клон неглубокий, поэтому её коммит догружаем отдельно.
      - name: Версия кеша в sw.js поднята
        env:
          SWVER_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$SWVER_BASE" ] && ! echo "$SWVER_BASE" | grep -qE '^0+$'; then git fetch --no-tags --depth=1 origin "$SWVER_BASE" || true; fi
          node tools/check-sw-ver.mjs
      - name: Прогон проверок
        run: node tools/run-tests.mjs ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '--quick' || '' }}

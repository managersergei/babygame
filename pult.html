<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Телефон-руль — МАШИНКИ</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#8fd3f4; user-select:none; -webkit-user-select:none; touch-action:none;
    font-family:"Arial Rounded MT Bold","Trebuchet MS",system-ui,-apple-system,sans-serif; color:#2b2140; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
    gap:10px; }
  #top { display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; }
  #top input { width:130px; font:inherit; font-weight:900; font-size:26px; text-align:center; letter-spacing:.2em; text-transform:uppercase;
    border:3px solid #2b6cb0; border-radius:14px; padding:6px; background:#fff; color:#2b6cb0; }
  .btn { border:none; border-radius:18px; font:inherit; font-weight:900; color:#2b2140; background:linear-gradient(#fff,#e6ecf5);
    box-shadow:0 7px 0 #9aa8bd, 0 12px 22px rgba(0,0,0,.25); cursor:pointer; }
  .btn.down { transform:translateY(7px); box-shadow:0 0 0 #9aa8bd; }
  #connect { padding:10px 18px; font-size:18px; background:linear-gradient(#fff2a8,#ffcf3d); box-shadow:0 6px 0 #d9a52a; }
  #st { text-align:center; font-weight:900; font-size:15px; color:#2b6cb0; min-height:20px; }
  #pad { flex:1; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr auto; gap:12px; min-height:0; }
  #L,#R { font-size:min(22vw,120px); }
  #S { grid-column:1/3; height:min(26vh,150px); font-size:min(9vw,44px); background:linear-gradient(#fff2a8,#ffcf3d); box-shadow:0 8px 0 #d9a52a, 0 14px 24px rgba(0,0,0,.25); }
  #tilt { padding:10px 16px; font-size:16px; }
  #tilt.on { background:linear-gradient(#c8f5b8,#7bd66b); box-shadow:0 6px 0 #4f9f40; }
  #mic { padding:10px 16px; font-size:16px; }
  #mic.on { background:linear-gradient(#ffd6e8,#ff8fb8); box-shadow:0 6px 0 #c9628a; }

  /* Ландшафт: кнопки по краям под большие пальцы, «прыжок» посередине. */
  @media (orientation: landscape) {
    #wrap { gap:6px; padding-top:max(6px,env(safe-area-inset-top)); }
    #top input { width:104px; font-size:20px; padding:4px; }
    #connect { padding:7px 13px; font-size:15px; }
    #tilt, #mic { padding:7px 12px; font-size:14px; }
    #st { font-size:13px; min-height:16px; }
    #pad { grid-template-columns:1fr 1.15fr 1fr; grid-template-rows:1fr; }
    #L { grid-column:1; grid-row:1; }
    #S { grid-column:2; grid-row:1; height:auto; font-size:min(4.6vw,30px); }
    #R { grid-column:3; grid-row:1; }
    #L,#R { font-size:min(13vh,86px); }
  }

  /* Подсказка о повороте — только в портрете и только пока не рулят наклоном. */
  #turnHint { position:fixed; left:50%; bottom:max(10px,env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:rgba(43,33,64,.78); color:#fff; font-size:13px; font-weight:900; padding:6px 14px; border-radius:100px;
    pointer-events:none; z-index:4; white-space:nowrap; }
  @media (orientation: landscape) { #turnHint { display:none; } }

  /* Руль: показывается вместо кнопок, когда включён наклон. */
  #wheel { position:fixed; left:50%; top:50%; width:min(62vh,62vw); height:min(62vh,62vw);
    margin-left:calc(min(62vh,62vw) / -2); margin-top:calc(min(62vh,62vw) / -2);
    opacity:0; transition:opacity .25s; pointer-events:none; z-index:3;
    will-change:transform; transform:rotate(0deg); }
  #wheel.on { opacity:.92; }
  #wheel svg { width:100%; height:100%; display:block; filter:drop-shadow(0 10px 18px rgba(0,0,0,.28)); }
  #wrap.tilt #L, #wrap.tilt #R, #wrap.tilt #S { display:none; }
  #wrap.tilt #pad { display:block; }

  /* Газ под левым большим пальцем, прыжок под правым: при рулении наклоном
     руки лежат по краям, и обычные кнопки туда не дотягиваются. */
  #thumbs { position:fixed; inset:auto 0 0 0; z-index:5; display:none;
    justify-content:space-between; pointer-events:none;
    padding:0 max(16px,env(safe-area-inset-left)) max(18px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right)); }
  #thumbs.on { display:flex; }
  #thumbs .round { pointer-events:auto; width:min(30vh,150px); height:min(30vh,150px); border-radius:50%;
    font-size:min(5.5vh,30px); display:flex; align-items:center; justify-content:center; }
  #G { background:linear-gradient(#c8f5b8,#7bd66b); box-shadow:0 8px 0 #4f9f40, 0 14px 24px rgba(0,0,0,.25); }
  #J { background:linear-gradient(#fff2a8,#ffcf3d); box-shadow:0 8px 0 #d9a52a, 0 14px 24px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <input id="code" maxlength="4" placeholder="КОД" autocapitalize="characters" autocomplete="off">
    <button class="btn" id="connect">ПОДКЛЮЧИТЬ</button>
    <button class="btn" id="tilt">📐 НАКЛОН — РУЛЬ</button>
    <button class="btn" id="mic">🎤 МИКРОФОН</button>
  </div>
  <div id="st">Введи код с экрана игры</div>
  <div id="pad">
    <button class="btn" id="L">◀</button>
    <button class="btn" id="R">▶</button>
    <button class="btn" id="S">⬆ ПРЫЖОК</button>
  </div>
</div>
<div id="thumbs">
  <button class="btn round" id="G">ГАЗ</button>
  <button class="btn round" id="J">⬆</button>
</div>
<div id="turnHint">🔄 Поверни телефон — рулить удобнее</div>
<div id="wheel" aria-hidden="true">
  <svg viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="45" fill="none" stroke="#2b2140" stroke-width="9"/>
    <circle cx="50" cy="50" r="45" fill="none" stroke="#584a86" stroke-width="4"/>
    <g stroke="#2b2140" stroke-width="8" stroke-linecap="round">
      <line x1="50" y1="50" x2="50" y2="9"/>
      <line x1="50" y1="50" x2="14" y2="70"/>
      <line x1="50" y1="50" x2="86" y2="70"/>
    </g>
    <circle cx="50" cy="50" r="14" fill="#ffcf3d" stroke="#2b2140" stroke-width="5"/>
    <circle cx="50" cy="16" r="4" fill="#ffcf3d"/>
  </svg>
</div>
<script>
(function () {
'use strict';
var st = document.getElementById('st'), codeEl = document.getElementById('code');
var wrapEl = document.getElementById('wrap'), wheelEl = document.getElementById('wheel');
var conn = null, peer = null, tiltOn = false, bound = false, wake = null, gen = 0, tmo = 0;
var micStream = null, micCall = null;
var lastSteer = 0, lastSend = 0, smooth = 0, roll0 = null, flatT = 0;
var DEAD = 4, MAXA = 30;                    // мёртвая зона и предел поворота, градусы
function status(s) { st.textContent = s; }
function send(m) { if (conn && conn.open) { try { conn.send(m); } catch (e) {} } }

function loadScript(urls, cb) {
  var i = 0;
  (function next() {
    if (i >= urls.length) return cb(false);
    var s = document.createElement('script'); s.src = urls[i++]; s.async = true;
    s.onload = function () { cb(true); }; s.onerror = next;
    document.head.appendChild(s);
  })();
}

/* Повторное подключение после сна компьютера. Прежняя версия ломалась трижды:
   старое соединение при destroy() перебивало статус фразой «Связь прервалась»,
   у попытки не было таймаута (зависала на «Соединяемся…»), и библиотека PeerJS
   скачивалась заново на каждое нажатие. */
function connect() {
  var code = (codeEl.value || '').trim().toUpperCase();
  if (code.length !== 4) { status('Нужен код из 4 знаков'); return; }
  try { localStorage.setItem('pult.code', code); } catch (e) {}
  status('Соединяемся…');
  var my = ++gen;                                    // хендлеры прошлых попыток молчат
  if (tmo) { clearTimeout(tmo); tmo = 0; }
  if (conn) { try { conn.close(); } catch (e) {} conn = null; }
  if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
  tmo = setTimeout(function () {
    if (my !== gen) return;
    if (!(conn && conn.open)) status('Не отвечает. Обнови экран игры или сосканируй QR заново');
  }, 9000);
  function go() {
    if (my !== gen) return;
    if (!window.Peer) { status('Нет интернета — не могу подключиться'); return; }
    peer = new Peer(undefined, { debug: 0 });
    peer.on('open', function () {
      if (my !== gen) return;
      conn = peer.connect('bgame-' + code, { reliable: false });
      conn.on('open', function () {
        if (my !== gen) return;
        if (tmo) { clearTimeout(tmo); tmo = 0; }
        status('Подключено ✓ Рули!'); keepAwake();
      });
      conn.on('close', function () { if (my === gen) status('Связь прервалась. Нажми «Подключить»'); });
      conn.on('error', function () { if (my === gen) status('Ошибка связи'); });
    });
    peer.on('error', function (e) {
      if (my !== gen) return;
      var t = (e && e.type) || '';
      if (t === 'peer-unavailable') {                 // игра как раз переподключается — повторим сами
        if (my === gen) setTimeout(function () { if (my === gen && !(conn && conn.open)) connect(); }, 2500);
        status('Игра не отвечает, пробую ещё раз…');
        return;
      }
      status('Ошибка: ' + t);
    });
  }
  if (window.Peer) { go(); return; }                  // библиотека уже в памяти — не качаем заново
  loadScript(['https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js', 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'], function (ok) {
    if (!ok) { status('Нет интернета — не могу подключиться'); return; }
    go();
  });
}
/* Блокировку экрана браузер снимает при уходе вкладки в фон и обратно не возвращает. */
function keepAwake() {
  if (!navigator.wakeLock) return;
  navigator.wakeLock.request('screen').then(function (w) { wake = w; }).catch(function () {});
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  keepAwake();
  if (!(conn && conn.open) && (codeEl.value || '').length === 4) connect();   // вернулись из фона — поднимаем связь
});

/* Защита от случайных касаний. Три реальных дефекта прежней версии: не учитывался
   pointerId (второй палец ломал удержание), pointerleave на телефоне приходит только
   при отпускании, и не было ни одного пути разрядки при уходе в фон — палец «залипал».
   Ладонь отсекаем по площади касания там, где браузер её сообщает. */
var held = {};                       // pointerId → { el, key, t }
var MAXHOLD = 8000;                  // дольше — это не нажатие, а лежащая рука
function press(el, key, down) {
  el.classList.toggle('down', down);
  send({ t: key === 'gas' ? 'gas' : 'key', k: key, d: down ? 1 : 0 });
  if (down && navigator.vibrate) navigator.vibrate(12);
}
function releaseAll() {
  for (var id in held) if (held.hasOwnProperty(id)) { press(held[id].el, held[id].key, false); delete held[id]; }
}
function bind(el, key) {
  el.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    if (e.width && e.height && e.width * e.height > 5200) return;       // ладонь, а не палец
    if (held[e.pointerId]) return;
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    held[e.pointerId] = { el: el, key: key, t: Date.now() };
    press(el, key, true);
  });
  function up(e) {
    if (!held[e.pointerId]) return;
    delete held[e.pointerId];
    var still = false;
    for (var id in held) if (held.hasOwnProperty(id) && held[id].el === el) still = true;
    if (!still) press(el, key, false);
  }
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('lostpointercapture', up);
}
bind(document.getElementById('L'), 'left');
bind(document.getElementById('R'), 'right');
bind(document.getElementById('S'), 'space');
bind(document.getElementById('G'), 'gas');
bind(document.getElementById('J'), 'space');
setInterval(function () {                                              // страховка от долгого удержания
  var now = Date.now();
  for (var id in held) if (held.hasOwnProperty(id) && now - held[id].t > MAXHOLD) {
    press(held[id].el, held[id].key, false); delete held[id];
  }
}, 500);
['visibilitychange', 'blur', 'pagehide'].forEach(function (ev) {
  (ev === 'visibilitychange' ? document : window).addEventListener(ev, releaseAll);
});

/* ── Наклон телефона = руль ──────────────────────────────────────────────────
   Крен считаем из вектора силы тяжести, а не из «сырого» gamma: в позе «держу
   как руль» (экран к лицу) gamma попадает в гимбал-лок и управление разваливается.
   Угол экрана вычитаем отдельно, поэтому ландшафт и портрет работают одинаково. */
function screenAngle() {
  var a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle
        : (typeof window.orientation === 'number' ? window.orientation : 0);
  return ((a % 360) + 360) % 360;
}
function wrap180(d) { return ((d + 180) % 360 + 360) % 360 - 180; }
function rollOf(e) {
  var b = (e.beta || 0) * Math.PI / 180, gm = (e.gamma || 0) * Math.PI / 180;
  var gx = Math.cos(b) * Math.sin(gm), gy = -Math.sin(b);
  if (Math.sqrt(gx * gx + gy * gy) < 0.25) return null;     // телефон почти плашмя — крен не определён
  return wrap180(Math.atan2(gx, -gy) * 180 / Math.PI - screenAngle());
}
function onOrient(e) {
  if (!tiltOn) return;
  var roll = rollOf(e);
  if (roll === null) {                                      // положили плашмя — держим последнее и подсказываем
    if (Date.now() - flatT > 1200) { flatT = Date.now(); status('Подними телефон повыше — руль не чувствует наклон'); }
    return;
  }
  if (roll0 === null) { roll0 = roll; status('Руль настроен — наклоняй влево-вправо'); }
  var raw = wrap180(roll - roll0);
  var n = Math.min(1, Math.max(0, (Math.abs(raw) - DEAD) / (MAXA - DEAD)));
  var v = (raw < 0 ? -1 : 1) * n;
  smooth += (v - smooth) * 0.35;                            // сглаживание: убирает дрожание руки
  var out = Math.max(-1, Math.min(1, smooth));
  var now = Date.now();
  if (Math.abs(out - lastSteer) > 0.03 || now - lastSend > 400) {
    lastSteer = out; lastSend = now; send({ t: 'steer', v: +out.toFixed(2) });
  }
  wheelEl.style.transform = 'rotate(' + Math.max(-120, Math.min(120, raw * 2.2)).toFixed(1) + 'deg)';
}
function setTilt(on) {
  tiltOn = on;
  document.getElementById('tilt').classList.toggle('on', on);
  wheelEl.classList.toggle('on', on);
  wrapEl.classList.toggle('tilt', on);
  document.getElementById('thumbs').classList.toggle('on', on);   // газ и прыжок под большие пальцы
  releaseAll();
  if (on) { roll0 = null; smooth = 0; }
  else {
    wheelEl.style.transform = 'rotate(0deg)';
    send({ t: 'steer', v: 0, off: 1 });                     // сразу отдаём управление кнопкам, без полутора секунд «прямо»
  }
}
/* Ландшафт по-настоящему умеет только Android и только из полноэкранного режима.
   На iPhone блокировки ориентации в вебе нет вовсе — там просто вёрстка на обе стороны. */
function goLandscape() {
  try {
    var el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!rq) return;
    var pr = rq.call(el, { navigationUI: 'hide' });
    if (pr && pr.then) pr.then(function () {
      try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape')['catch'](function () {}); } catch (e) {}
    })['catch'](function () {});
  } catch (e) {}
}
document.getElementById('tilt').addEventListener('click', function () {
  if (tiltOn) { setTilt(false); return; }
  goLandscape();                                            // тот же жест: полноэкранный режим и лок ориентации
  var D = window.DeviceOrientationEvent;
  if (!D) { status('Наклон не поддерживается — рули кнопками'); return; }
  function arm() { if (!bound) { window.addEventListener('deviceorientation', onOrient); bound = true; } setTilt(true); }
  if (typeof D.requestPermission === 'function') {
    D.requestPermission().then(function (r) {
      if (r === 'granted') arm();
      else status('Нет доступа к движению. Настройки → Safari → «Движение и ориентация»');
    })['catch'](function () { status('Наклон доступен только по HTTPS'); });
  } else arm();
});

/* Микрофон телефона в игру. Ребёнок держит телефон в руках, и его голос слышно
   заметно лучше, чем через микрофон компьютера на другом конце комнаты.
   Разрешение спрашивается по нажатию — иначе iOS откажет молча. */
document.getElementById('mic').addEventListener('click', function () {
  var b = this;
  if (micStream) {
    if (micCall) { try { micCall.close(); } catch (e) {} micCall = null; }
    micStream.getTracks().forEach(function (t) { t.stop(); });
    micStream = null; b.classList.remove('on'); status('Микрофон выключен');
    return;
  }
  if (!peer || !(conn && conn.open)) { status('Сначала подключись к игре'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { status('Микрофон недоступен'); return; }
  status('Разреши микрофон…');
  navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
    .then(function (stream) {
      micStream = stream;
      var code = (codeEl.value || '').trim().toUpperCase();
      micCall = peer.call('bgame-' + code, stream);
      b.classList.add('on');
      status('Микрофон включён 🎤 Говори в телефон');
    })
    .catch(function () { status('Нет доступа к микрофону. Настройки → Safari → Микрофон'); });
});

document.getElementById('connect').addEventListener('click', connect);
codeEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') connect(); });
var q = (location.search.match(/[?&]c=([A-Za-z0-9]{4})/) || [])[1];
if (q) { codeEl.value = q.toUpperCase(); connect(); }
else { try { var sv = localStorage.getItem('pult.code'); if (sv) codeEl.value = sv; } catch (e) {} }
})();
</script>
</body>
</html>
